# SwiftLint configuration for DiskSpace.
# Curated opt-in rules that catch real correctness/clarity issues beyond
# the permissive defaults, without drowning the project in style noise.

included:
  - Sources
  - Tests

opt_in_rules:
  - empty_count                 # `x.isEmpty` over `x.count == 0`
  - empty_string
  - first_where                 # `.first(where:)` over `.filter{}.first`
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - last_where
  - force_unwrapping            # flag `!` outside tests
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unused_optional_binding
  - explicit_init
  - collection_alignment
  - closure_spacing
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - sorted_first_last           # `.min()/.max()` over `.sorted().first/last`
  - fatal_error_message
  - overridden_super_call
  - prohibited_super_call

analyzer_rules:
  - unused_declaration
  - unused_import

# Tests use force-unwrapping deliberately for assertions.
force_unwrapping:
  severity: warning

line_length:
  warning: 120
  error: 160
  ignores_comments: true

type_body_length:
  warning: 350
  error: 450

file_length:
  warning: 400
  error: 600

identifier_name:
  excluded: [id, x, y, s, to]

excluded:
  - .build
